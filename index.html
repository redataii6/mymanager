<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MyManager - Redirecting...</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #3a86ff 0%, #8338ec 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: white;
    }
    .loader {
      text-align: center;
      background: white;
      padding: 50px;
      border-radius: 30px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.2);
      max-width: 350px;
      width: 90%;
    }
    .logo-img {
      max-width: 200px;
      height: auto;
      margin-bottom: 30px;
    }
    .spinner {
      border: 4px solid rgba(58, 134, 255, 0.1);
      border-top: 4px solid #3a86ff;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .loader p {
      color: #8d99ae;
      font-weight: 600;
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="loader">
    <img src="assets/images/logo.png" alt="MyManager Logo" class="logo-img">
    <div class="spinner"></div>
    <p>Initializing System...</p>
  </div>

  <script>
    // Redirect to login page after 1.5 seconds
    setTimeout(function() {
      window.location.href = 'login.html';
    }, 1500);
  </script>
</body>
</html>
