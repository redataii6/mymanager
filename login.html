<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MyManager - Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --primary-gradient: linear-gradient(135deg, #3a86ff 0%, #8338ec 100%);
    }
    body {
      background: var(--primary-gradient);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .login-card {
      max-width: 450px;
      width: 90%;
      background: white;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      overflow: hidden;
    }
    .login-header {
      background: white;
      padding: 40px 30px 20px;
      text-align: center;
    }
    .login-logo {
      max-width: 220px;
      height: auto;
      margin-bottom: 15px;
    }
    .login-body {
      padding: 20px 40px 40px;
    }
    .form-label {
      font-weight: 600;
      color: #2b2d42;
    }
    .form-control {
      padding: 12px 15px;
      border-radius: 12px;
      border: 1px solid #e0e0e0;
      background: #f8f9fa;
    }
    .form-control:focus {
      box-shadow: 0 0 0 4px rgba(58, 134, 255, 0.1);
      border-color: #3a86ff;
    }
    .btn-primary {
      background: var(--primary-gradient);
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-top: 10px;
      box-shadow: 0 8px 20px rgba(58, 134, 255, 0.3);
      transition: all 0.3s ease;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 25px rgba(58, 134, 255, 0.4);
    }
    .lang-switcher {
      margin-top: 30px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      padding: 8px 15px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .lang-switcher select {
      background: transparent;
      color: white;
      border: none;
      font-weight: 600;
      cursor: pointer;
    }
    .lang-switcher select option {
      color: #333;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-header">
      <img src="assets/images/logo.png" alt="MyManager Logo" class="login-logo">
      <p class="text-muted small mb-0" data-i18n="system_subtitle">Restaurant Management System</p>
    </div>
    <div class="login-body">
      <form id="loginForm">
        <div class="mb-3">
          <label for="username" class="form-label" data-i18n="username_label">Username</label>
          <input type="text" class="form-control" id="username" placeholder="Enter your username" required>
          <div class="mt-1"><small class="text-muted"><span data-i18n="default">Default</span>: admin</small></div>
        </div>
        <div class="mb-4">
          <label for="password" class="form-label" data-i18n="password_label">Password</label>
          <input type="password" class="form-control" id="password" placeholder="Enter your password" required>
          <div class="mt-1"><small class="text-muted"><span data-i18n="default">Default</span>: admin</small></div>
        </div>
        <div id="errorMsg" class="alert alert-danger d-none"></div>
        <button type="submit" class="btn btn-primary w-100" data-i18n="login_btn">LOGIN TO DASHBOARD</button>
      </form>
    </div>
  </div>

  <div class="lang-switcher">
    <select id="langSelect">
      <option value="en">English</option>
      <option value="fr">Français</option>
      <option value="ar">العربية</option>
    </select>
  </div>

  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
