<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MyManager - Tables</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <nav class="navbar navbar-dark bg-dark px-3">
    <a href="../dashboard.html" class="navbar-brand mb-0 h1">🍽️ MyManager</a>
    <div class="d-flex align-items-center gap-2">
      <select id="langSelect" class="form-select form-select-sm w-auto">
        <option value="en">English</option>
        <option value="fr">Français</option>
        <option value="ar">العربية</option>
      </select>
      <span class="text-white small" id="username"></span>
      <button id="btnLogout" class="btn btn-sm btn-outline-light"data-i18n="logout">Logout</button>
    </div>
  </nav>

  <div class="app-layout">
    <aside class="sidebar">
      <h6 class="px-3 pt-3 text-uppercase small text-muted">Menu</h6>
      <ul class="nav flex-column px-2 pb-3">
        <li class="nav-item"><a class="nav-link" href="../dashboard.html">📊 Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" href="dishes.html">🍕 Dishes</a></li>
        <li class="nav-item"><a class="nav-link active" href="tables.html">🪑 Tables</a></li>
        <li class="nav-item"><a class="nav-link" href="employees.html">👨‍🍳 Employees</a></li>
        <li class="nav-item"><a class="nav-link" href="reservations.html">📅 Reservations</a></li>
        <li class="nav-item"><a class="nav-link" href="orders.html">🧾 Orders</a></li>
      </ul>
    </aside>

    <main class="content p-4">
      <h2 class="h4 mb-4" data-i18n="tablesManagement"data-i18n="tablesManagement"data-i18n="tablesManagement"data-i18n="tablesManagement">Tables Management</h2>

      <div class="filters-bar">
        <div class="flex-grow-1">
          <input type="text" id="searchInput" class="form-control" placeholder="Search tables...">
        </div>
        <div>
          <select id="statusFilter" class="form-select">
            <option value="">All Status</option>
            <option value="free">Free</option>
            <option value="occupied">Occupied</option>
            <option value="reserved">Reserved</option>
            <option value="maintenance">Maintenance</option>
          </select>
        </div>
        <div>
          <select id="locationFilter" class="form-select">
            <option value="">All Locations</option>
            <option value="Indoor">Indoor</option>
            <option value="Terrace">Terrace</option>
            <option value="VIP">VIP</option>
          </select>
        </div>
        <button class="btn btn-outline-secondary" onclick="resetFilters()">Reset</button>
      </div>

      <div class="table-container">
        <div class="table-header">
          <h5 class="mb-0" data-i18n="allTables">All Tables</h5>
          <div class="table-actions">
            <button class="btn btn-success btn-sm" onclick="openCreateModal()">+ Add Table</button>
            <button class="btn btn-outline-primary btn-sm" onclick="exportToCSV()">📄 Export CSV</button>
          </div>
        </div>

        <div class="table-responsive">
          <table class="table table-hover mb-0">
            <thead>
              <tr>
                <th onclick="sortTable('number')" class="cursor-pointer">Number ↕</th>
                <th onclick="sortTable('seats')" class="cursor-pointer">Seats ↕</th>
                <th onclick="sortTable('location')" class="cursor-pointer">Location ↕</th>
                <th onclick="sortTable('status')" class="cursor-pointer">Status ↕</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="tablesTableBody">
              <tr><td colspan="5" class="text-center">Loading...</td></tr>
            </tbody>
          </table>
        </div>

        <div class="pagination-container">
          <div>Showing <span id="showingInfo">0</span> of <span id="totalInfo">0</span> tables</div>
          <nav><ul class="pagination pagination-sm mb-0" id="paginationControls"></ul></nav>
        </div>
      </div>
    </main>
  </div>

  <!-- Create/Edit Modal -->
  <div class="modal fade" id="tableModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalTitle"data-i18n="addTable">Add Table</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="tableForm">
            <input type="hidden" id="tableId">
            <div class="mb-3">
              <label for="tableNumber" class="form-label">Table Number *</label>
              <input type="number" class="form-control" id="tableNumber" required min="1">
            </div>
            <div class="mb-3">
              <label for="tableSeats" class="form-label">Number of Seats *</label>
              <input type="number" class="form-control" id="tableSeats" required min="1" max="20">
            </div>
            <div class="mb-3">
              <label for="tableLocation" class="form-label">Location *</label>
              <select class="form-select" id="tableLocation" required>
                <option value="">Select location</option>
                <option value="Indoor">Indoor</option>
                <option value="Terrace">Terrace</option>
                <option value="VIP">VIP</option>
              </select>
            </div>
            <div class="mb-3">
              <label for="tableStatus" class="form-label">Status *</label>
              <select class="form-select" id="tableStatus" required>
                <option value="free">Free</option>
                <option value="occupied">Occupied</option>
                <option value="reserved">Reserved</option>
                <option value="maintenance">Maintenance</option>
              </select>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" onclick="saveTable()">Save</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Delete Modal -->
  <div class="modal fade" id="deleteModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header bg-danger text-white">
          <h5 class="modal-title">Confirm Delete</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          Are you sure you want to delete this table?
          <p class="mt-2 fw-bold" id="deleteItemName"></p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-danger" onclick="confirmDelete()">Delete</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/i18n.js"></script>
  <script src="../assets/js/crud-tables.js"></script>
</body>
</html>
