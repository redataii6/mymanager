<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MyManager - Employee Details</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
  <nav class="navbar navbar-dark bg-dark px-3">
    <a href="../dashboard.html" class="navbar-brand"><img src="../assets/images/logo.png" alt="Logo" style="height: 35px; filter: brightness(0) invert(1);"></a>
    <div class="d-flex align-items-center gap-2">
      <select id="langSelect" class="form-select form-select-sm w-auto">
        <option value="en">English</option><option value="fr">Français</option><option value="ar">العربية</option>
      </select>
      <span class="text-white small" id="username"></span>
      <button id="btnLogout" class="btn btn-sm btn-outline-light">Logout</button>
    </div>
  </nav>

  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-logo-container d-none d-md-block text-center p-3 border-bottom"><img src="../assets/images/logo.png" alt="MyManager" style="max-height: 40px; max-width: 100%;"></div>
      <h6 class="px-3 pt-3 text-uppercase small text-muted">Menu</h6>
      <ul class="nav flex-column px-2 pb-3">
        <li class="nav-item"><a class="nav-link" href="../dashboard.html">📊 Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" href="dishes.html">🍕 Dishes</a></li>
        <li class="nav-item"><a class="nav-link" href="tables.html">🪑 Tables</a></li>
        <li class="nav-item"><a class="nav-link active" href="employees.html">👨‍🍳 Employees</a></li>
        <li class="nav-item"><a class="nav-link" href="reservations.html">📅 Reservations</a></li>
        <li class="nav-item"><a class="nav-link" href="orders.html">🧾 Orders</a></li>
      </ul>
    </aside>

    <main class="content p-4">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="h4 mb-0">Employee Details</h2>
        <div class="d-flex gap-2">
          <button class="btn btn-sm btn-outline-primary" onclick="exportPDF()">📄 Export PDF</button>
          <a href="employees.html" class="btn btn-sm btn-secondary">← Back to List</a>
        </div>
      </div>

      <div id="detailContent" class="detail-card">
        <div class="text-center py-4">
          <div class="spinner-border"></div>
          <p class="mt-2">Loading...</p>
        </div>
      </div>

      <div class="detail-card mt-4">
        <h5 class="mb-3">Orders Handled</h5>
        <div id="relatedOrders"></div>
      </div>
    </main>
  </div>

  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/app.js"></script>
  <script>
    requireAuth();
    document.getElementById('username').textContent = sessionStorage.getItem('username');

    let currentEmployee = null;
    const urlParams = new URLSearchParams(window.location.search);
    const empId = urlParams.get('id');

    if (!empId) window.location.href = 'employees.html';

    async function loadDetails() {
      try {
        const data = await loadDatabase();
        currentEmployee = data.employees.find(e => e.id === empId);
        
        if (!currentEmployee) {
          document.getElementById('detailContent').innerHTML = 
            '<div class="alert alert-danger">Employee not found</div>';
          return;
        }

        document.getElementById('detailContent').innerHTML = `
          <div class="row">
            <div class="col-md-6">
              <div class="detail-row">
                <div class="detail-label">ID:</div>
                <div class="detail-value">${currentEmployee.id}</div>
              </div>
              <div class="detail-row">
                <div class="detail-label">Full Name:</div>
                <div class="detail-value"><strong>${currentEmployee.fullName}</strong></div>
              </div>
              <div class="detail-row">
                <div class="detail-label">Role:</div>
                <div class="detail-value"><span class="badge bg-info">${currentEmployee.role.replace('_', ' ')}</span></div>
              </div>
              <div class="detail-row">
                <div class="detail-label">Phone:</div>
                <div class="detail-value">${currentEmployee.phone}</div>
              </div>
            </div>
            <div class="col-md-6">
              <div class="detail-row">
                <div class="detail-label">Email:</div>
                <div class="detail-value">${currentEmployee.email}</div>
              </div>
              <div class="detail-row">
                <div class="detail-label">Salary:</div>
                <div class="detail-value">${formatCurrency(currentEmployee.salary)}</div>
              </div>
              <div class="detail-row">
                <div class="detail-label">Status:</div>
                <div class="detail-value">
                  <span class="badge ${currentEmployee.active ? 'bg-success' : 'bg-secondary'}">
                    ${currentEmployee.active ? 'Active' : 'Inactive'}
                  </span>
                </div>
              </div>
              <div class="detail-row">
                <div class="detail-label">Hire Date:</div>
                <div class="detail-value">${formatDate(currentEmployee.hireDate)}</div>
              </div>
            </div>
          </div>
        `;

        const relatedOrders = data.orders.filter(order => order.employeeId === empId);
        if (relatedOrders.length > 0) {
          const totalRevenue = relatedOrders.reduce((sum, order) => sum + order.total, 0);
          document.getElementById('relatedOrders').innerHTML = `
            <div class="alert alert-info">
              <strong>Total Orders Handled:</strong> ${relatedOrders.length} | 
              <strong>Total Revenue:</strong> ${formatCurrency(totalRevenue)}
            </div>
            <table class="table table-sm">
              <thead>
                <tr><th>Order ID</th><th>Table</th><th>Status</th><th>Total</th><th>Date</th></tr>
              </thead>
              <tbody>
                ${relatedOrders.map(order => `
                  <tr>
                    <td>${order.id}</td>
                    <td>${order.tableId}</td>
                    <td><span class="badge ${getStatusBadgeClass(order.status)}">${order.status}</span></td>
                    <td>${formatCurrency(order.total)}</td>
                    <td>${formatDateTime(order.createdAt)}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          `;
        } else {
          document.getElementById('relatedOrders').innerHTML = 
            '<p class="text-muted">No orders handled yet.</p>';
        }

      } catch (error) {
        console.error('Error:', error);
        document.getElementById('detailContent').innerHTML = 
          '<div class="alert alert-danger">Error loading details</div>';
      }
    }

    function exportPDF() {
      if (!currentEmployee) return;
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      doc.setFontSize(20);
      doc.text('Employee Details Report', 20, 20);
      doc.setFontSize(12);
      doc.text('MyManager Restaurant', 20, 30);
      doc.text('Generated: ' + new Date().toLocaleString(), 20, 36);

      doc.setFontSize(14);
      doc.text('Employee Information', 20, 50);
      
      doc.setFontSize(11);
      let y = 60;
      doc.text('ID: ' + currentEmployee.id, 30, y); y += 8;
      doc.text('Name: ' + currentEmployee.fullName, 30, y); y += 8;
      doc.text('Role: ' + currentEmployee.role, 30, y); y += 8;
      doc.text('Phone: ' + currentEmployee.phone, 30, y); y += 8;
      doc.text('Email: ' + currentEmployee.email, 30, y); y += 8;
      doc.text('Salary: ' + currentEmployee.salary + ' MAD', 30, y); y += 8;
      doc.text('Status: ' + (currentEmployee.active ? 'Active' : 'Inactive'), 30, y); y += 8;
      doc.text('Hire Date: ' + currentEmployee.hireDate, 30, y);

      doc.save('employee_' + currentEmployee.id + '_' + new Date().toISOString().split('T')[0] + '.pdf');
    }

    loadDetails();
  </script>
</body>
</html>
