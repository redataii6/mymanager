<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MyManager - Dishes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <!-- Top navbar -->
  <nav class="navbar navbar-dark bg-dark px-3">
    <a href="../dashboard.html" class="navbar-brand mb-0 h1">🍽️ MyManager</a>
    <div class="d-flex align-items-center gap-2">
      <select id="langSelect" class="form-select form-select-sm w-auto">
        <option value="en">English</option>
        <option value="fr">Français</option>
        <option value="ar">العربية</option>
      </select>
      <span class="text-white small" id="username"></span>
      <button id="btnLogout" class="btn btn-sm btn-outline-light">Logout</button>
    </div>
  </nav>

  <div class="app-layout">
    <aside class="sidebar">
      <h6 class="px-3 pt-3 text-uppercase small text-muted">Menu</h6>
      <ul class="nav flex-column px-2 pb-3">
        <li class="nav-item"><a class="nav-link" href="../dashboard.html">📊 Dashboard</a></li>
        <li class="nav-item"><a class="nav-link active" href="dishes.html">🍕 Dishes</a></li>
        <li class="nav-item"><a class="nav-link" href="tables.html">🪑 Tables</a></li>
        <li class="nav-item"><a class="nav-link" href="employees.html">👨‍🍳 Employees</a></li>
        <li class="nav-item"><a class="nav-link" href="reservations.html">📅 Reservations</a></li>
        <li class="nav-item"><a class="nav-link" href="orders.html">🧾 Orders</a></li>
      </ul>
    </aside>

    <main class="content p-4">
      <h2 class="h4 mb-4">Dishes Management</h2>

      <!-- Filters Bar -->
      <div class="filters-bar">
        <div class="flex-grow-1">
          <input type="text" id="searchInput" class="form-control" placeholder="Search dishes...">
        </div>
        <div>
          <select id="categoryFilter" class="form-select">
            <option value="">All Categories</option>
          </select>
        </div>
        <div>
          <select id="availabilityFilter" class="form-select">
            <option value="">All Status</option>
            <option value="true">Available</option>
            <option value="false">Unavailable</option>
          </select>
        </div>
        <button class="btn btn-outline-secondary" onclick="resetFilters()">Reset</button>
      </div>

      <!-- Table Container -->
      <div class="table-container">
        <div class="table-header">
          <h5 class="mb-0">All Dishes</h5>
          <div class="table-actions">
            <button class="btn btn-success btn-sm" onclick="openCreateModal()">
              + Add Dish
            </button>
            <button class="btn btn-outline-primary btn-sm" onclick="exportToCSV()">
              📄 Export CSV
            </button>
          </div>
        </div>

        <div class="table-responsive">
          <table class="table table-hover mb-0">
            <thead>
              <tr>
                <th onclick="sortTable('id')" class="cursor-pointer">ID ↕</th>
                <th onclick="sortTable('name')" class="cursor-pointer">Name ↕</th>
                <th onclick="sortTable('category')" class="cursor-pointer">Category ↕</th>
                <th onclick="sortTable('price')" class="cursor-pointer">Price ↕</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="dishesTableBody">
              <tr>
                <td colspan="6" class="text-center">Loading...</td>
              </tr>
            </tbody>
          </table>
        </div>

        <div class="pagination-container">
          <div>
            Showing <span id="showingInfo">0</span> of <span id="totalInfo">0</span> dishes
          </div>
          <nav>
            <ul class="pagination pagination-sm mb-0" id="paginationControls"></ul>
          </nav>
        </div>
      </div>
    </main>
  </div>

  <!-- Create/Edit Modal -->
  <div class="modal fade" id="dishModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalTitle">Add Dish</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="dishForm">
            <input type="hidden" id="dishId">
            <div class="mb-3">
              <label for="dishName" class="form-label">Name *</label>
              <input type="text" class="form-control" id="dishName" required>
            </div>
            <div class="mb-3">
              <label for="dishCategory" class="form-label">Category *</label>
              <input type="text" class="form-control" id="dishCategory" required>
            </div>
            <div class="mb-3">
              <label for="dishPrice" class="form-label">Price (MAD) *</label>
              <input type="number" class="form-control" id="dishPrice" step="0.01" required>
            </div>
            <div class="mb-3">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="dishAvailable" checked>
                <label class="form-check-label" for="dishAvailable">Available</label>
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" onclick="saveDish()">Save</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Delete Confirmation Modal -->
  <div class="modal fade" id="deleteModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header bg-danger text-white">
          <h5 class="modal-title">Confirm Delete</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          Are you sure you want to delete this dish?
          <p class="mt-2 fw-bold" id="deleteItemName"></p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-danger" onclick="confirmDelete()">Delete</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/i18n.js"></script>
  <script src="../assets/js/crud-dishes.js"></script>
</body>
</html>
