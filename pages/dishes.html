<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MyManager - Dishes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <!-- Top navbar -->
  <nav class="navbar navbar-dark bg-dark px-3">
    <a href="../dashboard.html" class="navbar-brand"><img src="../assets/images/logo.png" alt="Logo" style="height: 35px; filter: brightness(0) invert(1);"></a>
    <div class="d-flex align-items-center gap-2">
      <select id="langSelect" class="form-select form-select-sm w-auto">
        <option value="en">English</option>
        <option value="fr">Français</option>
        <option value="ar">العربية</option>
      </select>
      <span class="text-white small" id="username"></span>
      <button id="btnLogout" class="btn btn-sm btn-outline-light" data-i18n="logout">Logout</button>
    </div>
  </nav>

  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-logo-container d-none d-md-block text-center p-3 border-bottom"><img src="../assets/images/logo.png" alt="MyManager" style="max-height: 40px; max-width: 100%;"></div>
      <h6 class="px-3 pt-3 text-uppercase small text-muted" data-i18n="menu">Menu</h6>
      <ul class="nav flex-column px-2 pb-3">
        <li class="nav-item"><a class="nav-link" href="../dashboard.html">📊 <span data-i18n="dashboard">Dashboard</span></a></li>
        <li class="nav-item"><a class="nav-link active" href="dishes.html">🍕 <span data-i18n="dishes">Dishes</span></a></li>
        <li class="nav-item"><a class="nav-link" href="tables.html">🪑 <span data-i18n="tables">Tables</span></a></li>
        <li class="nav-item"><a class="nav-link" href="employees.html">👨‍🍳 <span data-i18n="employees">Employees</span></a></li>
        <li class="nav-item"><a class="nav-link" href="reservations.html">📅 <span data-i18n="reservations">Reservations</span></a></li>
        <li class="nav-item"><a class="nav-link" href="orders.html">🧾 <span data-i18n="orders">Orders</span></a></li>
      </ul>
    </aside>

    <main class="content p-4">
      <h2 class="h4 mb-4" data-i18n="dishes_management">Dishes Management</h2>

      <!-- Filters Bar -->
      <div class="filters-bar">
        <div class="flex-grow-1">
          <input type="text" id="searchInput" class="form-control" data-i18n="search_dishes" placeholder="Search dishes...">
        </div>
        <div>
          <select id="categoryFilter" class="form-select">
            <option value="" data-i18n="all_categories">All Categories</option>
          </select>
        </div>
        <div>
          <select id="availabilityFilter" class="form-select">
            <option value="" data-i18n="all_status">All Status</option>
            <option value="true" data-i18n="available">Available</option>
            <option value="false" data-i18n="unavailable">Unavailable</option>
          </select>
        </div>
        <button class="btn btn-outline-secondary" onclick="resetFilters()" data-i18n="reset">Reset</button>
      </div>

      <!-- Table Container -->
      <div class="table-container">
        <div class="table-header">
          <h5 class="mb-0" data-i18n="all_dishes">All Dishes</h5>
          <div class="table-actions">
            <button class="btn btn-success btn-sm" onclick="openCreateModal()">
              + <span data-i18n="add_dish">Add Dish</span>
            </button>
            <button class="btn btn-outline-primary btn-sm" onclick="exportToCSV()">
              📄 <span data-i18n="export_csv">Export CSV</span>
            </button>
          </div>
        </div>

        <div class="table-responsive">
          <table class="table table-hover mb-0">
            <thead>
              <tr>
                <th onclick="sortTable('id')" class="cursor-pointer"><span data-i18n="id">ID</span> ↕</th>
                <th onclick="sortTable('name')" class="cursor-pointer"><span data-i18n="name">Name</span> ↕</th>
                <th onclick="sortTable('category')" class="cursor-pointer"><span data-i18n="category">Category</span> ↕</th>
                <th onclick="sortTable('price')" class="cursor-pointer"><span data-i18n="price">Price</span> ↕</th>
                <th data-i18n="status">Status</th>
                <th data-i18n="actions">Actions</th>
              </tr>
            </thead>
            <tbody id="dishesTableBody">
              <tr>
                <td colspan="6" class="text-center" data-i18n="loading">Loading...</td>
              </tr>
            </tbody>
          </table>
        </div>

        <div class="pagination-container">
          <div>
            <span data-i18n="showing">Showing</span> <span id="showingInfo">0</span> <span data-i18n="of">of</span> <span id="totalInfo">0</span> <span data-i18n="dishes">dishes</span>
          </div>
          <nav>
            <ul class="pagination pagination-sm mb-0" id="paginationControls"></ul>
          </nav>
        </div>
      </div>
    </main>
  </div>

  <!-- Create/Edit Modal -->
  <div class="modal fade" id="dishModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalTitle" data-i18n="add_dish">Add Dish</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="dishForm">
            <input type="hidden" id="dishId">
            <div class="mb-3">
              <label for="dishName" class="form-label"><span data-i18n="name">Name</span> *</label>
              <input type="text" class="form-control" id="dishName" required>
            </div>
            <div class="mb-3">
              <label for="dishCategory" class="form-label"><span data-i18n="category">Category</span> *</label>
              <input type="text" class="form-control" id="dishCategory" required>
            </div>
            <div class="mb-3">
              <label for="dishPrice" class="form-label"><span data-i18n="price">Price</span> (MAD) *</label>
              <input type="number" class="form-control" id="dishPrice" step="0.01" required>
            </div>
            <div class="mb-3">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="dishAvailable" checked>
                <label class="form-check-label" for="dishAvailable" data-i18n="available">Available</label>
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" data-i18n="cancel">Cancel</button>
          <button type="button" class="btn btn-primary" onclick="saveDish()" data-i18n="save">Save</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Delete Confirmation Modal -->
  <div class="modal fade" id="deleteModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header bg-danger text-white">
          <h5 class="modal-title" data-i18n="confirm">Confirm Delete</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <span data-i18n="confirm_delete_dish">Are you sure you want to delete this dish?</span>
          <p class="mt-2 fw-bold" id="deleteItemName"></p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" data-i18n="cancel">Cancel</button>
          <button type="button" class="btn btn-danger" onclick="confirmDelete()" data-i18n="delete">Delete</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/i18n.js"></script>
  <script src="../assets/js/crud-dishes.js"></script>
</body>
</html>
