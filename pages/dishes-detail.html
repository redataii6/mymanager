<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MyManager - Dish Details</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
  <!-- jsPDF for PDF export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
  <nav class="navbar navbar-dark bg-dark px-3">
    <a href="../dashboard.html" class="navbar-brand mb-0 h1">🍽️ MyManager</a>
    <div class="d-flex align-items-center gap-2">
      <select id="langSelect" class="form-select form-select-sm w-auto">
        <option value="en">English</option>
        <option value="fr">Français</option>
        <option value="ar">العربية</option>
      </select>
      <span class="text-white small" id="username"></span>
      <button id="btnLogout" class="btn btn-sm btn-outline-light">Logout</button>
    </div>
  </nav>

  <div class="app-layout">
    <aside class="sidebar">
      <h6 class="px-3 pt-3 text-uppercase small text-muted">Menu</h6>
      <ul class="nav flex-column px-2 pb-3">
        <li class="nav-item"><a class="nav-link" href="../dashboard.html">📊 Dashboard</a></li>
        <li class="nav-item"><a class="nav-link active" href="dishes.html">🍕 Dishes</a></li>
        <li class="nav-item"><a class="nav-link" href="tables.html">🪑 Tables</a></li>
        <li class="nav-item"><a class="nav-link" href="employees.html">👨‍🍳 Employees</a></li>
        <li class="nav-item"><a class="nav-link" href="reservations.html">📅 Reservations</a></li>
        <li class="nav-item"><a class="nav-link" href="orders.html">🧾 Orders</a></li>
      </ul>
    </aside>

    <main class="content p-4">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="h4 mb-0">Dish Details</h2>
        <div class="d-flex gap-2">
          <button class="btn btn-sm btn-outline-primary" onclick="exportPDF()">
            📄 Export PDF
          </button>
          <a href="dishes.html" class="btn btn-sm btn-secondary">
            ← Back to List
          </a>
        </div>
      </div>

      <div id="detailContent" class="detail-card">
        <div class="text-center py-4">
          <div class="spinner-border" role="status"></div>
          <p class="mt-2">Loading...</p>
        </div>
      </div>

      <!-- Related orders section -->
      <div class="detail-card mt-4">
        <h5 class="mb-3">Related Orders</h5>
        <div id="relatedOrders" class="table-responsive">
          <p class="text-muted">Loading related orders...</p>
        </div>
      </div>
    </main>
  </div>

  <script src="../assets/js/auth.js"></script>
  <script>
    requireAuth();
    document.getElementById('username').textContent = sessionStorage.getItem('username');

    let currentDish = null;

    // Get dish ID from URL
    const urlParams = new URLSearchParams(window.location.search);
    const dishId = urlParams.get('id');

    if (!dishId) {
      window.location.href = 'dishes.html';
    }

    // Load dish details
    async function loadDetails() {
      try {
        const response = await fetch('../data/db.json');
        const data = await response.json();
        
        currentDish = data.dishes.find(d => d.id === dishId);
        
        if (!currentDish) {
          document.getElementById('detailContent').innerHTML = `
            <div class="alert alert-danger">Dish not found</div>
          `;
          return;
        }

        // Display dish details
        document.getElementById('detailContent').innerHTML = `
          <div class="row">
            <div class="col-md-6">
              <div class="detail-row">
                <div class="detail-label">ID:</div>
                <div class="detail-value">${currentDish.id}</div>
              </div>
              <div class="detail-row">
                <div class="detail-label">Name:</div>
                <div class="detail-value">${currentDish.name}</div>
              </div>
              <div class="detail-row">
                <div class="detail-label">Category:</div>
                <div class="detail-value">
                  <span class="badge bg-info">${currentDish.category}</span>
                </div>
              </div>
            </div>
            <div class="col-md-6">
              <div class="detail-row">
                <div class="detail-label">Price:</div>
                <div class="detail-value">${currentDish.price} MAD</div>
              </div>
              <div class="detail-row">
                <div class="detail-label">Availability:</div>
                <div class="detail-value">
                  <span class="badge ${currentDish.isAvailable ? 'bg-success' : 'bg-danger'}">
                    ${currentDish.isAvailable ? 'Available' : 'Unavailable'}
                  </span>
                </div>
              </div>
              <div class="detail-row">
                <div class="detail-label">Created At:</div>
                <div class="detail-value">${currentDish.createdAt}</div>
              </div>
            </div>
          </div>
        `;

        // Load related orders
        const relatedOrders = data.orders.filter(order => 
          order.items.some(item => item.dishId === dishId)
        );

        if (relatedOrders.length > 0) {
          const orderTable = `
            <table class="table table-sm">
              <thead>
                <tr>
                  <th>Order ID</th>
                  <th>Table</th>
                  <th>Quantity</th>
                  <th>Total</th>
                  <th>Date</th>
                </tr>
              </thead>
              <tbody>
                ${relatedOrders.map(order => {
                  const item = order.items.find(i => i.dishId === dishId);
                  return `
                    <tr>
                      <td>${order.id}</td>
                      <td>${order.tableId}</td>
                      <td>${item.qty}</td>
                      <td>${item.qty * item.unitPrice} MAD</td>
                      <td>${new Date(order.createdAt).toLocaleString()}</td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          `;
          document.getElementById('relatedOrders').innerHTML = orderTable;
        } else {
          document.getElementById('relatedOrders').innerHTML = 
            '<p class="text-muted">No orders found for this dish.</p>';
        }

      } catch (error) {
        console.error('Error loading details:', error);
        document.getElementById('detailContent').innerHTML = `
          <div class="alert alert-danger">Error loading dish details</div>
        `;
      }
    }

    // Export to PDF
    function exportPDF() {
      if (!currentDish) return;

      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      // Title
      doc.setFontSize(20);
      doc.text('Dish Details Report', 20, 20);

      // Restaurant name
      doc.setFontSize(12);
      doc.text('MyManager Restaurant', 20, 30);
      doc.text('Generated: ' + new Date().toLocaleString(), 20, 36);

      // Dish details
      doc.setFontSize(14);
      doc.text('Dish Information', 20, 50);
      
      doc.setFontSize(11);
      let y = 60;
      doc.text('ID: ' + currentDish.id, 30, y);
      y += 8;
      doc.text('Name: ' + currentDish.name, 30, y);
      y += 8;
      doc.text('Category: ' + currentDish.category, 30, y);
      y += 8;
      doc.text('Price: ' + currentDish.price + ' MAD', 30, y);
      y += 8;
      doc.text('Availability: ' + (currentDish.isAvailable ? 'Available' : 'Unavailable'), 30, y);
      y += 8;
      doc.text('Created At: ' + currentDish.createdAt, 30, y);

      // Save PDF
      doc.save('dish_' + currentDish.id + '_' + new Date().toISOString().split('T')[0] + '.pdf');
    }

    // Load data on page load
    loadDetails();
  </script>
</body>
</html>
