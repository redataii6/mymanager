<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MyManager - Reservation Details</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
  <nav class="navbar navbar-dark bg-dark px-3">
    <a href="../dashboard.html" class="navbar-brand mb-0 h1">🍽️ MyManager</a>
    <div class="d-flex align-items-center gap-2">
      <select id="langSelect" class="form-select form-select-sm w-auto"><option value="en">English</option><option value="fr">Français</option><option value="ar">العربية</option></select>
      <span class="text-white small" id="username"></span>
      <button id="btnLogout" class="btn btn-sm btn-outline-light"data-i18n="logout">Logout</button>
    </div>
  </nav>

  <div class="app-layout">
    <aside class="sidebar">
      <h6 class="px-3 pt-3 text-uppercase small text-muted">Menu</h6>
      <ul class="nav flex-column px-2 pb-3">
        <li class="nav-item"><a class="nav-link" href="../dashboard.html">📊 Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" href="dishes.html">🍕 Dishes</a></li>
        <li class="nav-item"><a class="nav-link" href="tables.html">🪑 Tables</a></li>
        <li class="nav-item"><a class="nav-link" href="employees.html">👨‍🍳 Employees</a></li>
        <li class="nav-item"><a class="nav-link active" href="reservations.html">📅 Reservations</a></li>
        <li class="nav-item"><a class="nav-link" href="orders.html">🧾 Orders</a></li>
      </ul>
    </aside>

    <main class="content p-4">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="h4 mb-0">Reservation Details</h2>
        <div class="d-flex gap-2">
          <button class="btn btn-sm btn-outline-primary" onclick="exportPDF()">📄 Export PDF</button>
          <a href="reservations.html" class="btn btn-sm btn-secondary">← Back</a>
        </div>
      </div>

      <div id="detailContent" class="detail-card">
        <div class="text-center py-4"><div class="spinner-border"></div><p class="mt-2">Loading...</p></div>
      </div>
    </main>
  </div>

  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/app.js"></script>
  <script>
    requireAuth();
    document.getElementById('username').textContent = sessionStorage.getItem('username');

    let currentReservation = null;
    const urlParams = new URLSearchParams(window.location.search);
    const resId = urlParams.get('id');
    if (!resId) window.location.href = 'reservations.html';

    async function loadDetails() {
      try {
        const data = await loadDatabase();
        currentReservation = data.reservations.find(r => r.id === resId);
        
        if (!currentReservation) {
          document.getElementById('detailContent').innerHTML = '<div class="alert alert-danger">Reservation not found</div>';
          return;
        }

        const table = data.tables.find(t => t.id === currentReservation.tableId);
        
        document.getElementById('detailContent').innerHTML = `
          <div class="row">
            <div class="col-md-6">
              <div class="detail-row"><div class="detail-label">ID:</div><div class="detail-value">${currentReservation.id}</div></div>
              <div class="detail-row"><div class="detail-label">Customer:</div><div class="detail-value"><strong>${currentReservation.customerName}</strong></div></div>
              <div class="detail-row"><div class="detail-label">Phone:</div><div class="detail-value">${currentReservation.customerPhone}</div></div>
              <div class="detail-row"><div class="detail-label">Email:</div><div class="detail-value">${currentReservation.customerEmail || 'N/A'}</div></div>
              <div class="detail-row"><div class="detail-label">Guests:</div><div class="detail-value">${currentReservation.guests} people</div></div>
            </div>
            <div class="col-md-6">
              <div class="detail-row"><div class="detail-label">Table:</div><div class="detail-value">${table ? `Table ${table.number} (${table.seats} seats)` : currentReservation.tableId}</div></div>
              <div class="detail-row"><div class="detail-label">Date & Time:</div><div class="detail-value">${formatDateTime(currentReservation.dateTime)}</div></div>
              <div class="detail-row"><div class="detail-label">Status:</div><div class="detail-value"><span class="badge ${getStatusBadgeClass(currentReservation.status)}">${currentReservation.status}</span></div></div>
              <div class="detail-row"><div class="detail-label">Notes:</div><div class="detail-value">${currentReservation.notes || 'No notes'}</div></div>
              <div class="detail-row"><div class="detail-label">Created:</div><div class="detail-value">${formatDateTime(currentReservation.createdAt)}</div></div>
            </div>
          </div>
        `;

      } catch (error) {
        console.error('Error:', error);
        document.getElementById('detailContent').innerHTML = '<div class="alert alert-danger">Error loading details</div>';
      }
    }

    function exportPDF() {
      if (!currentReservation) return;
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      doc.setFontSize(20);
      doc.text('Reservation Details', 20, 20);
      doc.setFontSize(12);
      doc.text('MyManager Restaurant', 20, 30);
      doc.text('Generated: ' + new Date().toLocaleString(), 20, 36);
      doc.setFontSize(14);
      doc.text('Reservation Information', 20, 50);
      doc.setFontSize(11);
      let y = 60;
      doc.text('ID: ' + currentReservation.id, 30, y); y += 8;
      doc.text('Customer: ' + currentReservation.customerName, 30, y); y += 8;
      doc.text('Phone: ' + currentReservation.customerPhone, 30, y); y += 8;
      doc.text('Date & Time: ' + currentReservation.dateTime, 30, y); y += 8;
      doc.text('Guests: ' + currentReservation.guests, 30, y); y += 8;
      doc.text('Table: ' + currentReservation.tableId, 30, y); y += 8;
      doc.text('Status: ' + currentReservation.status, 30, y);
      doc.save('reservation_' + currentReservation.id + '.pdf');
    }

    loadDetails();
  </script>
</body>
</html>
