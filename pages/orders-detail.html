<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MyManager - Order Details</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
  <nav class="navbar navbar-dark bg-dark px-3">
    <a href="../dashboard.html" class="navbar-brand"><img src="../assets/images/logo.png" alt="Logo" style="height: 35px; filter: brightness(0) invert(1);"></a>
    <div class="d-flex align-items-center gap-2">
      <select id="langSelect" class="form-select form-select-sm w-auto">
        <option value="en">English</option><option value="fr">Français</option><option value="ar">العربية</option>
      </select>
      <span class="text-white small" id="username"></span>
      <button id="btnLogout" class="btn btn-sm btn-outline-light">Logout</button>
    </div>
  </nav>

  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-logo-container d-none d-md-block text-center p-3 border-bottom"><img src="../assets/images/logo.png" alt="MyManager" style="max-height: 40px; max-width: 100%;"></div>
      <h6 class="px-3 pt-3 text-uppercase small text-muted">Menu</h6>
      <ul class="nav flex-column px-2 pb-3">
        <li class="nav-item"><a class="nav-link" href="../dashboard.html">📊 Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" href="dishes.html">🍕 Dishes</a></li>
        <li class="nav-item"><a class="nav-link" href="tables.html">🪑 Tables</a></li>
        <li class="nav-item"><a class="nav-link" href="employees.html">👨‍🍳 Employees</a></li>
        <li class="nav-item"><a class="nav-link" href="reservations.html">📅 Reservations</a></li>
        <li class="nav-item"><a class="nav-link active" href="orders.html">🧾 Orders</a></li>
      </ul>
    </aside>

    <main class="content p-4">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="h4 mb-0">Order Details</h2>
        <div class="d-flex gap-2">
          <button class="btn btn-sm btn-outline-primary" onclick="exportPDF()">📄 Export PDF</button>
          <a href="orders.html" class="btn btn-sm btn-secondary">← Back to List</a>
        </div>
      </div>

      <div class="row">
        <div class="col-lg-8">
          <div id="detailContent" class="detail-card">
            <div class="text-center py-4">
              <div class="spinner-border"></div>
              <p class="mt-2">Loading...</p>
            </div>
          </div>

          <div class="detail-card mt-4">
            <h5 class="mb-3">Order Items</h5>
            <div id="orderItems"></div>
          </div>
        </div>

        <div class="col-lg-4">
          <div class="detail-card">
            <h5 class="mb-3">Order Summary</h5>
            <div id="orderSummary"></div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/app.js"></script>
  <script>
    requireAuth();
    document.getElementById('username').textContent = sessionStorage.getItem('username');

    let currentOrder = null;
    const urlParams = new URLSearchParams(window.location.search);
    const orderId = urlParams.get('id');

    if (!orderId) window.location.href = 'orders.html';

    async function loadDetails() {
      try {
        const data = await loadDatabase();
        currentOrder = data.orders.find(o => o.id === orderId);
        
        if (!currentOrder) {
          document.getElementById('detailContent').innerHTML = 
            '<div class="alert alert-danger">Order not found</div>';
          return;
        }

        const table = data.tables.find(t => t.id === currentOrder.tableId);
        const employee = data.employees.find(e => e.id === currentOrder.employeeId);

        // Main details
        document.getElementById('detailContent').innerHTML = `
          <div class="row">
            <div class="col-md-6">
              <div class="detail-row">
                <div class="detail-label">Order ID:</div>
                <div class="detail-value"><strong>${currentOrder.id}</strong></div>
              </div>
              <div class="detail-row">
                <div class="detail-label">Table:</div>
                <div class="detail-value">${table ? `Table ${table.number}` : currentOrder.tableId}</div>
              </div>
              <div class="detail-row">
                <div class="detail-label">Employee:</div>
                <div class="detail-value">${employee ? employee.fullName : currentOrder.employeeId}</div>
              </div>
            </div>
            <div class="col-md-6">
              <div class="detail-row">
                <div class="detail-label">Status:</div>
                <div class="detail-value">
                  <span class="badge ${getStatusBadgeClass(currentOrder.status)}">${currentOrder.status}</span>
                </div>
              </div>
              <div class="detail-row">
                <div class="detail-label">Created:</div>
                <div class="detail-value">${formatDateTime(currentOrder.createdAt)}</div>
              </div>
              <div class="detail-row">
                <div class="detail-label">Notes:</div>
                <div class="detail-value">${currentOrder.notes || 'No notes'}</div>
              </div>
            </div>
          </div>
        `;

        // Order items
        const itemsTable = currentOrder.items.map(item => {
          const dish = data.dishes.find(d => d.id === item.dishId);
          const dishName = dish ? dish.name : item.dishId;
          const itemTotal = item.qty * item.unitPrice;
          
          return `
            <tr>
              <td>${dishName}</td>
              <td class="text-center">${item.qty}</td>
              <td class="text-end">${formatCurrency(item.unitPrice)}</td>
              <td class="text-end"><strong>${formatCurrency(itemTotal)}</strong></td>
            </tr>
          `;
        }).join('');

        document.getElementById('orderItems').innerHTML = `
          <table class="table table-sm">
            <thead>
              <tr>
                <th>Dish</th>
                <th class="text-center">Quantity</th>
                <th class="text-end">Unit Price</th>
                <th class="text-end">Total</th>
              </tr>
            </thead>
            <tbody>
              ${itemsTable}
            </tbody>
          </table>
        `;

        // Order summary
        const itemsCount = currentOrder.items.reduce((sum, item) => sum + item.qty, 0);
        document.getElementById('orderSummary').innerHTML = `
          <div class="detail-row">
            <div class="detail-label">Total Items:</div>
            <div class="detail-value">${currentOrder.items.length} types</div>
          </div>
          <div class="detail-row">
            <div class="detail-label">Total Quantity:</div>
            <div class="detail-value">${itemsCount} items</div>
          </div>
          <div class="detail-row border-top pt-3 mt-3">
            <div class="detail-label"><strong>Total Amount:</strong></div>
            <div class="detail-value"><strong class="text-success fs-4">${formatCurrency(currentOrder.total)}</strong></div>
          </div>
        `;

      } catch (error) {
        console.error('Error:', error);
        document.getElementById('detailContent').innerHTML = 
          '<div class="alert alert-danger">Error loading order details</div>';
      }
    }

    function exportPDF() {
      if (!currentOrder) return;
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      doc.setFontSize(20);
      doc.text('Order Receipt', 20, 20);
      doc.setFontSize(12);
      doc.text('MyManager Restaurant', 20, 30);
      doc.text('Generated: ' + new Date().toLocaleString(), 20, 36);

      doc.setFontSize(14);
      doc.text('Order Information', 20, 50);
      
      doc.setFontSize(11);
      let y = 60;
      doc.text('Order ID: ' + currentOrder.id, 30, y); y += 8;
      doc.text('Table: ' + currentOrder.tableId, 30, y); y += 8;
      doc.text('Employee: ' + currentOrder.employeeId, 30, y); y += 8;
      doc.text('Status: ' + currentOrder.status, 30, y); y += 8;
      doc.text('Date: ' + currentOrder.createdAt, 30, y); y += 15;

      doc.setFontSize(14);
      doc.text('Order Items', 20, y); y += 10;
      
      doc.setFontSize(10);
      currentOrder.items.forEach(item => {
        doc.text(`${item.qty}x ${item.dishId} - ${formatCurrency(item.qty * item.unitPrice)}`, 30, y);
        y += 7;
      });

      y += 10;
      doc.setFontSize(14);
      doc.text('Total: ' + formatCurrency(currentOrder.total), 30, y);

      doc.save('order_' + currentOrder.id + '.pdf');
    }

    loadDetails();
  </script>
</body>
</html>
